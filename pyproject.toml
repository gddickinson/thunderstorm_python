[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thunderstorm-python"
version = "1.0.0"
description = "Python reimplementation of thunderSTORM ImageJ plugin for SMLM data analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "George"},
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
tiff = ["tifffile>=2021.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
# Flat layout: the repository root *is* the thunderstorm_python package.
package-dir = {"thunderstorm_python" = "."}
packages = ["thunderstorm_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
